            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }
        .icon-container {
            background: white;

            justify-content: space-around;
            align-items: center;
            margin-top: 20px;
            gap: 30px;
        }
        .icon-demo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .icon-demo span {
            color: #666;
            font-size: 12px;
        }
        .color-demos {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }
        .color-demo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .color-demo span {
            font-size: 11px;
            color: #999;
        }
        svg {
            display: block;
        }
