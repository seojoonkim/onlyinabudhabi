<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appeal Icon Options</title>
    <style>
        body {
            font-family: 'Etihad Altis', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #2d4a5a;
            margin-bottom: 40px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .option-card {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .option-card h3 {
            color: #2d4a5a;
            margin-bottom: 20px;
            font-size: 16px;
        }
        .preview {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 18px;
            color: #2d4a5a;
            margin: 20px 0;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        .note {
            color: #666;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Appeal 아이콘 옵션 - 가독성 우선</h1>

    <div class="options-grid">
        <!-- Option 1: Solid Star -->
        <div class="option-card">
            <h3>1. Solid Star</h3>
            <div class="preview">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:inline-block;vertical-align:middle;">
                    <path d="M12 2 L15.09 8.26 L22 9.27 L17 14.14 L18.18 21.02 L12 17.77 L5.82 21.02 L7 14.14 L2 9.27 L8.91 8.26 Z"/>
                </svg>
                <span>85</span>
            </div>
            <p class="note">가장 심플한 별 아이콘</p>
        </div>

        <!-- Option 2: Simple Circle -->
        <div class="option-card">
            <h3>2. Simple Circle</h3>
            <div class="preview">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="display:inline-block;vertical-align:middle;">
                    <circle cx="12" cy="12" r="10"/>
                </svg>
                <span>85</span>
            </div>
            <p class="note">극도로 심플한 원</p>
        </div>

        <!-- Option 3: Diamond (Simple) -->
        <div class="option-card">
            <h3>3. Simple Diamond</h3>
            <div class="preview">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="display:inline-block;vertical-align:middle;">
                    <path d="M12 2 L22 12 L12 22 L2 12 Z"/>
                </svg>
                <span>85</span>
            </div>
            <p class="note">심플한 다이아몬드</p>
        </div>

        <!-- Option 4: Heart -->
        <div class="option-card">
            <h3>4. Heart</h3>
            <div class="preview">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:inline-block;vertical-align:middle;">
                    <path d="M12 21.35 L10.55 20.03 C5.4 15.36 2 12.27 2 8.5 C2 5.41 4.42 3 7.5 3 C9.24 3 10.91 3.81 12 5.08 C13.09 3.81 14.76 3 16.5 3 C19.58 3 22 5.41 22 8.5 C22 12.27 18.6 15.36 13.45 20.03 L12 21.35 Z"/>
                </svg>
                <span>85</span>
            </div>
            <p class="note">하트 아이콘</p>
        </div>

        <!-- Option 5: Flame -->
        <div class="option-card">
            <h3>5. Flame</h3>
            <div class="preview">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:inline-block;vertical-align:middle;">
                    <path d="M13.5 0.67 C13.5 0.67 14 5.92 17 8.18 C20 10.44 21 12 21 15 C21 18.31 18.31 21 15 21 C11.69 21 9 18.31 9 15 C9 13 10 11 11 9.5 C10 11 9.5 12.5 9.5 15 C9.5 15.97 9.67 16.89 10 17.75 C9.37 16.94 9 15.93 9 15 C9 12.5 10 10.43 12 8.5 C12 8.5 11.5 3.5 13.5 0.67 Z"/>
                </svg>
                <span>85</span>
            </div>
            <p class="note">불꽃 아이콘 (인기/핫)</p>
        </div>

        <!-- Option 6: Sparkle (Simple) -->
        <div class="option-card">
            <h3>6. Simple Sparkle</h3>
            <div class="preview">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:inline-block;vertical-align:middle;">
                    <path d="M12 0 L14 10 L12 11 L10 10 Z M24 12 L14 14 L13 12 L14 10 Z M12 24 L10 14 L12 13 L14 14 Z M0 12 L10 10 L11 12 L10 14 Z"/>
                    <circle cx="12" cy="12" r="2.5"/>
                </svg>
                <span>85</span>
            </div>
            <p class="note">단순화된 스파클 (4방향)</p>
        </div>

        <!-- Option 7: Trophy -->
        <div class="option-card">
            <h3>7. Trophy</h3>
            <div class="preview">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:inline-block;vertical-align:middle;">
                    <path d="M7 3 L7 6 C7 8.21 8.79 10 11 10 L13 10 C15.21 10 17 8.21 17 6 L17 3 M12 10 L12 15 M8 15 L16 15 M9 18 L15 18"/>
                    <rect x="8" y="2" width="8" height="4" rx="1"/>
                </svg>
                <span>85</span>
            </div>
            <p class="note">트로피 아이콘</p>
        </div>

        <!-- Option 8: No Icon -->
        <div class="option-card">
            <h3>8. No Icon</h3>
            <div class="preview">
                <span>85</span>
            </div>
            <p class="note">아이콘 없이 숫자만</p>
        </div>
    </div>

    <div style="text-align: center; margin-top: 40px; color: #666;">
        <p>어떤 옵션이 가장 읽기 편한가요? (번호로 말씀해주세요)</p>
    </div>
</body>
</html>
