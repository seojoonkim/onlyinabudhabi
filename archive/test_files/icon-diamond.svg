<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Top table (flat top surface) -->
  <polygon points="8,7 16,7 14,5 10,5" fill="currentColor"/>

  <!-- Crown facets -->
  <!-- Center crown facets -->
  <polygon points="10,5 8,7 12,10" fill="currentColor" opacity="0.85"/>
  <polygon points="14,5 16,7 12,10" fill="currentColor" opacity="0.7"/>

  <!-- Side crown facets -->
  <polygon points="8,7 5,8 12,10" fill="currentColor" opacity="0.95"/>
  <polygon points="16,7 19,8 12,10" fill="currentColor" opacity="0.65"/>

  <!-- Girdle (widest part) -->
  <line x1="5" y1="8" x2="19" y2="8" stroke="currentColor" stroke-width="0.5" opacity="0.4"/>

  <!-- Pavilion facets (bottom pyramid) -->
  <polygon points="5,8 12,10 12,20" fill="currentColor" opacity="0.6"/>
  <polygon points="12,10 19,8 12,20" fill="currentColor" opacity="0.45"/>

  <!-- Culet (bottom point) -->
  <circle cx="12" cy="20" r="0.5" fill="currentColor" opacity="0.8"/>
</svg>
