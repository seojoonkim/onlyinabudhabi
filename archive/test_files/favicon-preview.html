<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favicon Preview</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }
        .preview-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .preview-container h2 {
            color: #2d4a5a;
            margin-bottom: 30px;
        }
        .size-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            margin-top: 20px;
        }
        .size-demo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .size-demo img {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        .size-demo span {
            color: #666;
            font-size: 12px;
        }
        .bg-demos {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            justify-content: center;
        }
        .bg-demo {
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .bg-demo span {
            font-size: 11px;
            color: #666;
        }
        .bg-light {
            background: #f5f5f5;
        }
        .bg-dark {
            background: #2d2d2d;
        }
        .bg-dark span {
            color: #ccc;
        }
    </style>
</head>
<body>
    <h1 style="color: #2d4a5a;">Abu Dhabi Favicon Preview</h1>

    <div class="preview-container">
        <h2>Different Sizes</h2>
        <div class="size-grid">
            <div class="size-demo">
                <img src="favicon.svg" width="16" height="16" alt="16x16">
                <span>16×16</span>
            </div>
            <div class="size-demo">
                <img src="favicon.svg" width="32" height="32" alt="32x32">
                <span>32×32</span>
            </div>
            <div class="size-demo">
                <img src="favicon.svg" width="48" height="48" alt="48x48">
                <span>48×48</span>
            </div>
            <div class="size-demo">
                <img src="favicon.svg" width="64" height="64" alt="64x64">
                <span>64×64</span>
            </div>
        </div>

        <div class="bg-demos">
            <div class="bg-demo bg-light">
                <img src="favicon.svg" width="32" height="32" alt="Light bg">
                <span>Light Background</span>
            </div>
            <div class="bg-demo bg-dark">
                <img src="favicon.svg" width="32" height="32" alt="Dark bg">
                <span>Dark Background</span>
            </div>
        </div>
    </div>

    <div class="preview-container" style="max-width: 600px;">
        <h2>Favicon Design</h2>
        <p style="color: #666; line-height: 1.6;">
            아부다비의 상징인 셰이크 자이드 모스크에서 영감을 받은 디자인입니다.
            <br>
            • 흰색 돔과 아치형 창문<br>
            • 금색 초승달과 별<br>
            • 에티하드 틸 배경 (#2d4a5a)<br>
            • 작은 크기(16px)에서도 선명하게 보이는 디자인
        </p>
        <div style="margin-top: 20px;">
            <img src="favicon.svg" width="128" height="128" alt="Large preview" style="border-radius: 12px;">
        </div>
    </div>

    <div style="background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <p style="color: #666; margin: 0;">
            💡 <strong>Tip:</strong> 브라우저 탭을 확인해서 파비콘이 잘 보이는지 확인하세요!
        </p>
    </div>
</body>
</html>
