<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d4a5a"/>
      <stop offset="100%" style="stop-color:#3d5a6b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4915d"/>
      <stop offset="100%" style="stop-color:#c97d3d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" fill="url(#bg)" rx="14"/>

  <!-- Central dome -->
  <ellipse cx="32" cy="28" rx="10" ry="8" fill="url(#gold)"/>
  <rect x="22" y="28" width="20" height="16" fill="url(#gold)"/>

  <!-- Side minarets -->
  <rect x="16" y="18" width="3" height="12" fill="url(#gold)" rx="1.5"/>
  <circle cx="17.5" cy="17" r="2.5" fill="url(#gold)"/>

  <rect x="45" y="18" width="3" height="12" fill="url(#gold)" rx="1.5"/>
  <circle cx="46.5" cy="17" r="2.5" fill="url(#gold)"/>

  <!-- Central minaret -->
  <rect x="30.5" y="12" width="3" height="8" fill="url(#gold)" rx="1.5"/>
  <path d="M 32 8 L 34 12 L 30 12 Z" fill="url(#gold)"/>

  <!-- Arched entrance -->
  <path d="M 28 38 Q 28 32 32 32 Q 36 32 36 38 L 36 44 L 28 44 Z" fill="#2d4a5a"/>

  <!-- Side domes -->
  <ellipse cx="26" cy="26" rx="4" ry="3" fill="url(#gold)" opacity="0.9"/>
  <ellipse cx="38" cy="26" rx="4" ry="3" fill="url(#gold)" opacity="0.9"/>
</svg>
