<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" fill="#2d4a5a" rx="12"/>

  <!-- Mosque Dome (inspired by Sheikh Zayed Mosque) -->
  <!-- Main dome -->
  <ellipse cx="32" cy="30" rx="16" ry="12" fill="#f5f5f5" opacity="0.95"/>
  <path d="M 16 30 Q 32 20, 48 30" fill="none" stroke="#e8eaed" stroke-width="1.5"/>
  <path d="M 20 30 Q 32 22, 44 30" fill="none" stroke="#e8eaed" stroke-width="1"/>

  <!-- Crescent moon on top -->
  <path d="M 32 16 A 4 4 0 1 0 32 12 A 3 3 0 1 1 32 16" fill="#ffd700"/>
  <circle cx="32" cy="14" r="1.5" fill="#ffd700"/>

  <!-- Building/Base -->
  <rect x="20" y="32" width="24" height="16" fill="#f5f5f5" opacity="0.9"/>

  <!-- Arches/Windows -->
  <path d="M 24 36 Q 26 34, 28 36 L 28 44 L 24 44 Z" fill="#2d4a5a" opacity="0.3"/>
  <path d="M 30 36 Q 32 34, 34 36 L 34 44 L 30 44 Z" fill="#2d4a5a" opacity="0.3"/>
  <path d="M 36 36 Q 38 34, 40 36 L 40 44 L 36 44 Z" fill="#2d4a5a" opacity="0.3"/>

  <!-- Decorative elements -->
  <rect x="18" y="48" width="28" height="2" fill="#f5f5f5" opacity="0.9"/>

  <!-- Small stars/sparkles -->
  <circle cx="12" cy="18" r="1.5" fill="#ffd700" opacity="0.7"/>
  <circle cx="52" cy="18" r="1.5" fill="#ffd700" opacity="0.7"/>
  <circle cx="18" cy="52" r="1" fill="#ffd700" opacity="0.5"/>
  <circle cx="46" cy="52" r="1" fill="#ffd700" opacity="0.5"/>
</svg>
