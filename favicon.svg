<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d4a5a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d5a6b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="64" height="64" fill="url(#bg)" rx="14"/>

  <!-- Outer diamond -->
  <path d="M 32 10 L 54 32 L 32 54 L 10 32 Z"
        fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>

  <!-- Inner diamond with gold fill -->
  <path d="M 32 18 L 46 32 L 32 46 L 18 32 Z"
        fill="#ffd700" opacity="0.3"/>

  <!-- Top facet (lighter) -->
  <path d="M 32 10 L 54 32 L 32 32 Z" fill="#ffffff" opacity="0.15"/>

  <!-- Right facet (darker) -->
  <path d="M 32 32 L 54 32 L 32 54 Z" fill="#ffffff" opacity="0.08"/>

  <!-- Left facet (medium) -->
  <path d="M 32 10 L 10 32 L 32 32 Z" fill="#ffffff" opacity="0.12"/>

  <!-- Bottom facet (darkest) -->
  <path d="M 32 32 L 10 32 L 32 54 Z" fill="#ffffff" opacity="0.05"/>
</svg>
